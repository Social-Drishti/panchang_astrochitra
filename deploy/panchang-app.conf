server {
  listen 80;
  listen [::]:80;
  server_name app.astrochitra.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name app.astrochitra.com;

  ssl_certificate /etc/letsencrypt/live/app.astrochitra.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.astrochitra.com/privkey.pem;

  access_log /var/log/nginx/app.astrochitra.com.access.log main;
  error_log /var/log/nginx/app.astrochitra.com.error.log;

  client_max_body_size 10M;

  include /etc/nginx/global_settings;
  add_header Cache-Control no-transform;

  location ^~ /.well-known {
    auth_basic off;
    allow all;
  }

  # Same-origin API -> php-fpm pool (keeps REQUEST_URI so the router sees /api/v1/...
  location /api/v1 {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9002;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /var/www/astrochitra-app/server/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_read_timeout 300;
  }

  # Explabs AI provider (same-origin proxy; strips /api/explabs and prepends /v1
  # so upstream receives the same /v1/chat/completions path as direct mode)
  location /api/explabs/ {
    proxy_pass https://api.experientiallabs.ai/v1/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host api.experientiallabs.ai;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60;
    proxy_send_timeout 180;
    proxy_read_timeout 180;
  }

  # SPA -> pm2 serve (single-page mode handles deep links)
  location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60;
    proxy_send_timeout 180;
    proxy_read_timeout 180;
  }
}