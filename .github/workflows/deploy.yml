name: Panchang Astrochitra CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-panchang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-flight Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA (validation)
        run: npm run build

      - name: Lint PHP
        run: |
          set -e
          failed=""
          while IFS= read -r f; do
            if ! php -l "$f" >/dev/null 2>&1; then
              failed="$failed $f"
            fi
          done < <(find server -name '*.php' -type f)
          if [ -n "$failed" ]; then echo "PHP lint failed:$failed"; exit 1; fi
          echo "All PHP files lint clean"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: FORCE_DEPLOY,APP_ENV
          script: |
            set -e
            cd /var/www/astrochitra-app
            git fetch origin && git reset --hard origin/main
            bash scripts/deploy.sh